# Opero 的 nginx 反代例子：放进 /etc/nginx/conf.d/opero.conf，改 server_name 和证书路径，nginx -t && systemctl reload nginx
# 然后 /etc/opero/opero.env 里 OPERO_HOST=127.0.0.1、OPERO_URL=https://opero.example.com，opero restart
server {
    listen 80;
    server_name opero.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name opero.example.com;
    ssl_certificate     /etc/letsencrypt/live/opero.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opero.example.com/privkey.pem;

    client_max_body_size 32m;   # 聊天里发文件（后台上限 30 MB）

    # 大文件：上传安装包（后台上限 2 GB）、Agent 传编译产物（300 MB）——放开大小、边收边转，不在 nginx 里攒
    location ~ ^/api/(workspaces/[^/]+/packages|agent/blob/) {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:7300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:7300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # 实时消息（SSE）和手机推送是长连接：不缓冲、不超时
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# 装在子路径下（https://www.example.com/opero/）：和别的网站共用一个域名时用。
