<!doctype html>
<!-- 外壳自带的「连接你的 Opero」页：一人一套，第一次打开填自己那套的地址（+ 网页「我 → 账号安全 → 接手机」给的配对码）。
     样式和网页 code/web/src/styles.css 一致；调外壳用 window.OperoNative.pair(地址, 配对码)，结果回 window.__operoPair(ok, 说明) -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>连接你的 Opero</title>
<style>
  :root { --bg: #F3F5F8; --panel: #FFFFFF; --text: #101826; --sub: #4B5668; --faint: #667286; --line: #E2E7EE;
    --primary: #5B4FE9; --primary-soft: #EEECFE; --violet: #8B5CF6; --danger: #D92D20; --danger-soft: #FEECEB; --m1: #7C6CFF; --m2: #4F3FE0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0D0E10; --panel: #141518; --text: #F2F3F4; --sub: #A3A8AF; --faint: #8A9098; --line: #26292E;
      --primary: #7C6CFF; --primary-soft: rgba(124,108,255,.14); --danger: #FF6B6B; --danger-soft: rgba(255,107,107,.12); --m1: #A496FF; --m2: #6B5BF6; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif; font-size: 14px; color: var(--text);
    background: radial-gradient(60% 40% at 50% 22%, var(--primary-soft), transparent), var(--bg); -webkit-tap-highlight-color: transparent; }
  main { max-width: 380px; margin: 0 auto; padding: 56px 24px 32px; display: flex; flex-direction: column; gap: 16px; }
  .logo { display: flex; justify-content: center; }
  h1 { margin: 4px 0 0; font-size: 22px; text-align: center; }
  p { margin: 0; color: var(--sub); line-height: 1.7; text-align: center; }
  label { display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: var(--sub); font-weight: 500; }
  input { height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); padding: 0 14px; font-size: 16px; outline: 0; }
  input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .hint { font-size: 12px; color: var(--faint); font-weight: 400; line-height: 1.6; }
  button { height: 46px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--primary), var(--violet)); }
  button:disabled { opacity: .6; }
  .err { display: none; background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; }
  .err.on { display: block; }
</style>
</head>
<body>
<main>
  <div class="logo">
    <svg width="72" height="72" viewBox="0 0 100 100" aria-label="Opero">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: var(--m1)"/><stop offset="1" style="stop-color: var(--m2)"/></linearGradient></defs>
      <path d="M24.02,65.00 A30,30 0 1 1 35.92,76.49 L19.0,83.0 Z" fill="none" stroke="url(#g)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="8.5" fill="#2EE6B0"/>
    </svg>
  </div>
  <h1 data-k="title">连接你的 Opero</h1>
  <p data-k="intro">Opero 没有公共服务器，App 只连你自己服务器上装的那套。还没装？在电脑上打开 github.com/yimaworks/opero 看安装说明。</p>
  <div class="err" id="err"></div>
  <label><span data-k="addr">地址</span>
    <input id="server" inputmode="url" autocomplete="url" data-ph="addrPh" placeholder="https://opero.你的域名 或 http://服务器IP:7300" />
  </label>
  <label><span data-k="code">配对码</span>
    <input id="code" inputmode="numeric" maxlength="8" data-ph="codePh" placeholder="6 位数字" />
    <span class="hint" data-k="codeHint">在电脑上打开 Opero →「我 → 账号安全 → 接手机」拿。配对后这台手机才能收提醒、用指纹验证本人；不填也能先打开看。</span>
  </label>
  <button id="go" data-k="go">连接</button>
</main>
<script>
  // 多语言：跟着手机系统语言（简体 / 繁體 / English / 日本語 / Deutsch / Français / العربية）
  const L = {
    'zh-CN': { title: '连接你的 Opero', intro: 'Opero 没有公共服务器，App 只连你自己服务器上装的那套。还没装？在电脑上打开 github.com/yimaworks/opero 看安装说明。', addr: '地址', addrPh: 'https://opero.你的域名 或 http://服务器IP:7300', code: '配对码', codePh: '6 位数字', codeHint: '在电脑上打开 Opero →「我 → 账号安全 → 接手机」拿。配对后这台手机才能收提醒、用指纹验证本人；不填也能先打开看。', go: '连接', going: '连接中…', needAddr: '先填地址' },
    'zh-TW': { title: '連接你的 Opero', intro: 'Opero 沒有公共伺服器，App 只連你自己伺服器上裝的那套。還沒裝？在電腦上打開 github.com/yimaworks/opero 看安裝說明。', addr: '位址', addrPh: 'https://opero.你的網域 或 http://伺服器IP:7300', code: '配對碼', codePh: '6 位數字', codeHint: '在電腦上打開 Opero →「我 → 帳號安全 → 接手機」取得。配對後這支手機才能收提醒、用指紋驗證本人；不填也能先打開看。', go: '連接', going: '連接中…', needAddr: '先填位址' },
    en: { title: 'Connect your Opero', intro: 'Opero has no public server: the app only connects to the Opero you installed on your own server. Not installed yet? See github.com/yimaworks/opero on a computer.', addr: 'Address', addrPh: 'https://opero.your-domain or http://server-ip:7300', code: 'Pairing code', codePh: '6 digits', codeHint: 'On a computer, open Opero → Me → Account security → Connect phone. Pairing lets this phone get alerts and verify it\'s you with your fingerprint; you can also skip it and just open.', go: 'Connect', going: 'Connecting…', needAddr: 'Enter the address first' },
    ja: { title: 'あなたの Opero に接続', intro: 'Opero に公開サーバーはありません。アプリは自分のサーバーにインストールした Opero にだけ接続します。まだの場合は、PC で github.com/yimaworks/opero のインストール手順を見てください。', addr: 'アドレス', addrPh: 'https://opero.あなたのドメイン または http://サーバーIP:7300', code: 'ペアリングコード', codePh: '6 桁の数字', codeHint: 'PC で Opero を開き「自分 → アカウントのセキュリティ → スマホを接続」で取得します。ペアリングすると通知と指紋による本人確認が使えます。空欄のままでも開けます。', go: '接続', going: '接続中…', needAddr: '先にアドレスを入力してください' },
    de: { title: 'Mit deinem Opero verbinden', intro: 'Opero hat keinen öffentlichen Server: Die App verbindet sich nur mit dem Opero auf deinem eigenen Server. Noch nicht installiert? Schau dir github.com/yimaworks/opero am Computer an.', addr: 'Adresse', addrPh: 'https://opero.deine-domain oder http://server-ip:7300', code: 'Kopplungscode', codePh: '6 Ziffern', codeHint: 'Am Computer: Opero öffnen → Ich → Kontosicherheit → Handy verbinden. Nach dem Koppeln bekommt dieses Handy Benachrichtigungen und kann dich per Fingerabdruck bestätigen. Du kannst es auch leer lassen.', go: 'Verbinden', going: 'Verbinde…', needAddr: 'Gib zuerst die Adresse ein' },
    fr: { title: 'Connecter ton Opero', intro: "Opero n'a pas de serveur public : l'app se connecte uniquement à l'Opero installé sur ton propre serveur. Pas encore installé ? Va sur github.com/yimaworks/opero depuis un ordinateur.", addr: 'Adresse', addrPh: 'https://opero.ton-domaine ou http://ip-serveur:7300', code: 'Code d’appairage', codePh: '6 chiffres', codeHint: 'Sur un ordinateur : Opero → Moi → Sécurité du compte → Connecter un téléphone. Une fois appairé, ce téléphone reçoit les alertes et peut confirmer ton identité par empreinte. Tu peux aussi laisser vide.', go: 'Connecter', going: 'Connexion…', needAddr: "Saisis d'abord l'adresse" },
    ar: { title: 'اتصل بـ Opero الخاص بك', intro: 'لا يوجد خادم عام لـ Opero: التطبيق يتصل فقط بـ Opero المثبّت على خادمك. لم تثبّته بعد؟ افتح github.com/yimaworks/opero على الحاسوب.', addr: 'العنوان', addrPh: 'https://opero.نطاقك أو http://IP-الخادم:7300', code: 'رمز الاقتران', codePh: '6 أرقام', codeHint: 'على الحاسوب: افتح Opero ← أنا ← أمان الحساب ← ربط الهاتف. بعد الاقتران يتلقى هذا الهاتف التنبيهات ويمكنه التحقق منك ببصمة الإصبع؛ يمكنك تركه فارغًا.', go: 'اتصال', going: 'جارٍ الاتصال…', needAddr: 'أدخل العنوان أولًا' },
  }
  const pick = () => {
    for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'])) {
      const x = l.toLowerCase()
      if (/^zh-(tw|hk|mo)|^zh-hant/.test(x)) return 'zh-TW'
      if (x.startsWith('zh')) return 'zh-CN'
      for (const c of ['en', 'ja', 'de', 'fr', 'ar']) if (x === c || x.startsWith(c + '-')) return c
    }
    return 'en'
  }
  const lang = pick()
  const T = L[lang]
  document.documentElement.lang = lang
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
  document.title = T.title
  document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = T[el.dataset.k] })
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = T[el.dataset.ph] })

  const q = new URLSearchParams(location.search)
  const $ = (id) => document.getElementById(id)
  $('server').value = q.get('server') || ''
  const showErr = (msg) => { $('err').textContent = msg; $('err').classList.toggle('on', !!msg) }
  showErr(q.get('error') || '')
  window.__operoPair = (ok, msg) => { $('go').disabled = false; $('go').textContent = T.go; if (!ok) showErr(msg) }
  $('go').onclick = () => {
    const server = $('server').value.trim()
    if (!server) { showErr(T.needAddr); return }
    showErr('')
    $('go').disabled = true; $('go').textContent = T.going
    if (window.OperoNative) window.OperoNative.pair(server, $('code').value.trim())
    else location.href = server
  }
</script>
</body>
</html>
